name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Reject committed credentials and runtime files
        run: uv run python -m scripts.audit_repository --history
      - run: uv run pytest --cov=agent --cov=api --cov=training --cov-report=term-missing --cov-report=xml
      - name: Validate DVC pipeline and infrastructure documents
        run: uv run python scripts/validate_config.py
      - name: Validate actual DVC import and pipeline graph
        run: uv run dvc dag
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
