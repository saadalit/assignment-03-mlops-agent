stages:
  validate:
    cmd: python -m training.train --stage validate --workspace artifacts/pipeline
    deps:
      - data/iris.csv
      - training/stages.py
    outs:
      - artifacts/pipeline/validation.json
  preprocess:
    cmd: python -m training.train --stage preprocess --workspace artifacts/pipeline
    deps:
      - artifacts/pipeline/validation.json
    outs:
      - artifacts/pipeline/split.npz
  train:
    cmd: python -m training.train --stage train --workspace artifacts/pipeline
    deps:
      - artifacts/pipeline/split.npz
    outs:
      - artifacts/pipeline/model.joblib
  evaluate:
    cmd: python -m training.train --stage evaluate --workspace artifacts/pipeline
    deps:
      - artifacts/pipeline/model.joblib
    outs:
      - artifacts/pipeline/evaluation.json:
          cache: false
    metrics:
      - artifacts/pipeline/metrics.json:
          cache: false
  quality_gate:
    cmd: python -m training.train --stage gate --workspace artifacts/pipeline
    deps:
      - artifacts/pipeline/evaluation.json
    always_changed: true
